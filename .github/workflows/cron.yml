name: Cron quotidien

on:
  schedule:
    - cron: "23 3 * * *"   # 03h23 UTC (minute décalée : GitHub retarde moins) — pronos et coupons prêts vers 5h-6h Dakar
  workflow_dispatch:        # + lancement manuel

permissions:
  contents: write

jobs:
  pronos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy requests

      - name: Import + vérification + publication
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python cron_quotidien.py

      - name: Synchronisation Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_supabase.py

      - name: Coupons du jour
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generer_coupons.py

      - name: Kit marketing du jour
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generer_kit.py

      - name: Commit horodaté (la preuve du palmarès)
        run: |
          git config user.name "moteur-bot"
          git config user.email "bot@users.noreply.github.com"
          git add donnees/ kit_du_jour.txt
          git commit -m "Pronos du $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Rien de neuf"
          git push

      - name: Rappels d'abonnement (J-3 et jour J)
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/rappels" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Alerte manager (coupons validés)
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/rappels?mode=manager" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      # ---------- Pages Google de aura90.app (27/10/2026) ----------
      # S'active quand la variable SITE_URL est définie (Settings → Secrets and
      # variables → Actions → Variables). Écrit les pages /pronostics, /pronostic,
      # /palmares et le sitemap dans le dépôt aura90-app (jeton APP_REPO_TOKEN).
      # En cas de souci, le reste du cron n'est jamais bloqué.
      - name: Pages Google — récupération du site
        if: ${{ vars.SITE_URL != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sebastiengastonmbaye-tech/aura90-app
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: site

      - name: Pages Google — génération et mise en ligne
        if: ${{ vars.SITE_URL != '' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generer_seo.py site
          cd site
          git config user.name "moteur-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pronostic pronostics palmares sitemap.xml robots.txt
          git commit -m "Pages Google du $(date -u +'%Y-%m-%d')" || echo "Rien de neuf"
          git push
