name: Relance des paiements non aboutis

on:
  schedule:
    - cron: "17,47 * * * *"   # toutes les 30 min ; la fonction respecte elle-même les heures calmes
  workflow_dispatch:

jobs:
  relance:
    runs-on: ubuntu-latest
    steps:
      - name: Relancer les paiements non aboutis
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/rappels?mode=relances" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
