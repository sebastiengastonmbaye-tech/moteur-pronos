name: Montantes (rattrapage)

on:
  schedule:
    - cron: "41 6,10,14 * * *"   # ~7h, 11h et 15h Dakar — palier du jour s'il manque (minute décalée)
  workflow_dispatch:

jobs:
  montantes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy requests

      - name: Vérifier et publier les montantes du jour
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generer_coupons.py --montantes
