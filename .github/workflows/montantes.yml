name: Montantes (rattrapage)

on:
  schedule:
    - cron: "0 7,11 * * *"    # 7h et 11h Dakar (9h et 13h Paris) — palier du jour s'il manque
  workflow_dispatch:

jobs:
  montantes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy requests

      - name: Vérifier et publier les montantes du jour
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generer_coupons.py --montantes
